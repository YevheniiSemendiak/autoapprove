name: Auto Approve Bot PRs

on:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Run auto-approve scanner
        env:
          # ── Secret ─────────────────────────────────────────────────────────
          # A PAT (or fine-grained token) with read access to org repos and
          # pull-request write access. Store it in repo/org Secrets.
          GH_TOKEN: ${{ secrets.AUTO_APPROVE_TOKEN }}

          # ── Configuration (store in repo/org Variables, not Secrets) ───────
          # Comma-separated list of GitHub org or user names to scan.
          LIST_OF_OWNERS: ${{ vars.LIST_OF_OWNERS }}

          # Comma-separated list of bot usernames whose PRs may be approved.
          ALLOWED_AUTHORS: ${{ vars.ALLOWED_AUTHORS }}

          # Label that must be present on a PR before it is approved.
          REQUIRED_LABEL: ${{ vars.REQUIRED_LABEL || '' }}

          # Set to "true" in repo Variables to log without actually approving.
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: uv run auto-approve
