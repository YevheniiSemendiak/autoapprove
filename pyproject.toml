[project]
name = "auto-approve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.5",
]

[project.scripts]
auto-approve = "auto_approve.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_approve"]
